      debian: { manager: apt, name: gh }
  scroll_reverser:
    platforms:
      macos: { manager: brew_cask, name: scroll-reverser }
  sketchybar:
    platforms:
      macos: { manager: brew_formula, name: sketchybar }
  trash:
    platforms:
      macos: { manager: brew_formula, name: trash }
  uv:
    platforms:
      macos: { manager: brew_formula, name: uv }
      arch: { manager: script, name: uv }
      debian: { manager: script, name: uv }
  fnm:
    platforms:
      macos: { manager: brew_formula, name: fnm }
      arch: { manager: script, name: fnm }
      debian: { manager: script, name: fnm }
  aerospace:
    platforms:
      macos: { manager: brew_cask, name: aerospace }
  fira_code_nerd_font:
    platforms:
      macos: { manager: brew_cask, name: font-fira-code-nerd-font }
  mas:
    platforms:
      macos: { manager: brew_formula, name: mas }
  ghostty:
    platforms:
      macos: { manager: brew_cask, name: ghostty }
  docker_desktop:
    platforms:
      macos: { manager: brew_cask, name: docker-desktop }
  rar:
    platforms:
      macos: { manager: brew_cask, name: rar }
  obsidian:
    platforms:
      macos: { manager: brew_cask, name: obsidian }
  google_chrome:
    platforms:
      macos: { manager: brew_cask, name: google-chrome }
  zen:
