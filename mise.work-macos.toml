[env]
NODE_OPTIONS = "--use-system-ca"
REQUESTS_CA_BUNDLE = "/Library/Application Support/DocuSign/zscaler-ca-bundle.pem"
NODE_EXTRA_CA_CERTS = "/Library/Application Support/DocuSign/zscaler-ca-bundle.pem"
SSL_CERT_FILE = "/Library/Application Support/DocuSign/zscaler-ca-bundle.pem"
AWS_CA_BUNDLE = "/Library/Application Support/DocuSign/zscaler-ca-bundle.pem"
CURL_CA_BUNDLE = "/Library/Application Support/DocuSign/zscaler-ca-bundle.pem"
HTTPLIB2_CA_CERTS = "/Library/Application Support/DocuSign/zscaler-ca-bundle.pem"
_.path = ["{{ env.HOME }}/.local/bin"]
GH_HOST = { age = "" }
GH_ENTERPRISE_TOKEN = { age = "" }
ADO_MCP_AUTH_TOKEN = { age = "" }
GOOGLE_CLOUD_PROJECT = { age = "" }
GOOGLE_CLOUD_LOCATION = { age = "" }
GOOGLE_OAUTH_CLIENT_ID = { age = "" }
GOOGLE_OAUTH_CLIENT_SECRET = { age = "" }
CONTEXT7_API_KEY = { age = "" }
BRAVE_SEARCH_API_KEY = { age = "" }
FIGMA_API_KEY = { age = "" }

[vars]
profile = "work-macos"

[tools]
"pipx:azure-cli" = "2.89.1"
"pipx:snowflake-cli" = "3.24.1"
gcloud = "580.0.0"
"npm:@azure/mcp" = "3.0.0-beta.35"
"npm:@azure-devops/mcp" = "2.9.0"
"npm:figma-developer-mcp" = "0.13.2"
"npm:kusto-mcp" = "1.14.0"

[tools."http:twg"]
version = "1.1.1"
bin = "twg"

[tools."http:twg".platforms]
macos-arm64 = { url = "https://teamwork-graph.atlassian.com/cli/twg-darwin-arm64-v1.1.1", checksum = "sha256:9f7cfab754ac759cb5b04ee88661c0ce21375414ec88283d6d6f098dd20aaf83" }
macos-x64 = { url = "https://teamwork-graph.atlassian.com/cli/twg-darwin-x64-v1.1.1", checksum = "sha256:4037a9ace273e9e9d61e6ad2063b273de6d79f5fd7b116096d484a30e8522873" }
linux-arm64 = { url = "https://teamwork-graph.atlassian.com/cli/twg-linux-arm64-v1.1.1", checksum = "sha256:8de4d5ad3fe2c35cf03bdb07333964169b51969ff9f8c13b94248222c9be0bc4" }
linux-x64 = { url = "https://teamwork-graph.atlassian.com/cli/twg-linux-x64-v1.1.1", checksum = "sha256:226104f5497dfa2305d75f9f3efc174ac0f7752ad74f4c964b70d57cc6a69a17" }

[bootstrap.packages]
"mas:937984704" = "latest"

[bootstrap.user]
login_shell = "/opt/homebrew/bin/fish"

[dotfiles]
"~/.config/fish/conf.d/10-mise-profile.fish" = "dotfiles/work/mise-profile.fish"
"~/.gitconfig" = "dotfiles/work/gitconfig"
"~/.pi/agent/settings.json" = "dotfiles/work/pi/agent/settings.json"
"~/.pi/agent/mcp.json" = "dotfiles/work/pi/agent/mcp.json"
"~/.pi/agent/models.json" = "dotfiles/work/pi/agent/models.json"
"~/.pi/agent/extensions/pi-openai-fast.json" = "dotfiles/work/pi/agent/extensions/pi-openai-fast.json"
"~/.pi/workflows/model-tiers.json" = "dotfiles/work/pi/workflows/model-tiers.json"
"~/.pi/workflows/saved" = "dotfiles/work/pi/workflows/saved"
"~/.agents" = "dotfiles/work/agents"
