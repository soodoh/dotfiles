[env]
NODE_OPTIONS = "--use-system-ca"
AZURE_CONFIG_DIR = "{{ env.HOME }}/.azure/dev/.azure"
MISE_BREW_CASK_OPT_APPDIR = "{{ env.HOME }}/Applications"
SSL_CERT_FILE = { age = "" }
REQUESTS_CA_BUNDLE = "${SSL_CERT_FILE:-}"
NODE_EXTRA_CA_CERTS = "${SSL_CERT_FILE:-}"
AWS_CA_BUNDLE = "${SSL_CERT_FILE:-}"
CURL_CA_BUNDLE = "${SSL_CERT_FILE:-}"
HTTPLIB2_CA_CERTS = "${SSL_CERT_FILE:-}"
HTTP_PROXY = "http://127.0.0.1:1055"
HTTPS_PROXY = "http://127.0.0.1:1055"
NO_PROXY = "localhost,127.0.0.1,::1"
GH_HOST = { age = "" }
GH_ENTERPRISE_TOKEN = { age = "" }
FIGMA_API_KEY = { age = "" }
LITELLM_API_KEY = { age = "" }
ADO_MCP_PAT_BASIC = { age = "" }
AZURE_SUBSCRIPTION_ID = { age = "" }
AZURE_DEV_TENANT_ID = { age = "" }
AZURE_PROD_TENANT_ID = { age = "" }
GOST_AUTH_USERNAME = { age = "" }
GOST_AUTH_PASSWORD = { age = "" }

[tools]
"pipx:azure-cli" = "2.90.0"
"pipx:snowflake-cli" = "3.28.0"
# MSF TrueDev tooling. Docker/Compose and jq come from the shared profile;
# Azure CLI is declared above; gcloud is shared.
"aqua:Azure/kubelogin" = "0.2.20"
"aqua:GoogleContainerTools/skaffold" = "2.25.0"
"aqua:PowerShell/PowerShell" = "7.6.6"
"aqua:ahmetb/kubectx" = "0.11.0"
"aqua:derailed/k9s" = "0.51.0"
"aqua:helm/helm" = "4.3.0"
"aqua:kubernetes/kubernetes/kubectl" = "1.37.1"
"npm:@azure/mcp" = "2.0.5"
"npm:@azure-devops/mcp" = { version = "2.10.0", allow_builds = ["keytar"] }
"npm:figma-developer-mcp" = "0.13.2"

[tools."http:twg"]
version = "1.3.1"
bin = "twg"
version_list_url = "https://teamwork-graph.atlassian.com/cli/manifest.json"
version_json_path = ".version"
checksum_url = "https://teamwork-graph.atlassian.com/cli/SHA256SUMS-v{{ version }}"
platforms= { macos-arm64 = { url = "https://teamwork-graph.atlassian.com/cli/twg-darwin-arm64-v{{ version }}" }, macos-x64 = { url = "https://teamwork-graph.atlassian.com/cli/twg-darwin-x64-v{{ version }}" }, linux-arm64 = { url = "https://teamwork-graph.atlassian.com/cli/twg-linux-arm64-v{{ version }}" }, linux-x64 = { url = "https://teamwork-graph.atlassian.com/cli/twg-linux-x64-v{{ version }}" } }

[bootstrap.packages]
"brew:gost" = { version = "latest", os = "macos" }

[bootstrap.directories."/etc/tailscale"]
owner = "root"
group = "wheel"
mode = "0755"

[bootstrap.files."/etc/tailscale/tailscaled-env.txt"]
source = "dotfiles/work/tailscaled-env.txt"
owner = "root"
group = "wheel"
mode = "0600"

[bootstrap.macos.launchd.agents.tailscale-control-proxy]
program = "~/.local/bin/mise"
args = [
  "--env",
  "work-macos",
  "exec",
  "--",
  "bash",
  "dotfiles/work/gost-tailscale-control.sh",
]
run_at_load = true
keep_alive = true
working_directory = "~/.local/share/dotfiles"
environment = { PATH = "/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin", MISE_EXEC_AUTO_INSTALL = "false" }
stdout_path = "~/Library/Logs/tailscale-control-proxy.log"
stderr_path = "~/Library/Logs/tailscale-control-proxy.error.log"

# Serves only the public routing rule on loopback; system PAC activation is opt-in.
[bootstrap.macos.launchd.agents.cli-proxy-pac]
program = "~/.local/bin/mise"
args = [
  "--env",
  "work-macos",
  "exec",
  "--",
  "python3",
  "-m",
  "http.server",
  "1056",
  "--bind",
  "127.0.0.1",
  "--directory",
  "dotfiles/work/pac/site",
]
run_at_load = true
keep_alive = true
working_directory = "~/.local/share/dotfiles"
environment = { PATH = "/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin", MISE_EXEC_AUTO_INSTALL = "false" }
stdout_path = "~/Library/Logs/cli-proxy-pac.log"
stderr_path = "~/Library/Logs/cli-proxy-pac.error.log"

[bootstrap.user]
login_shell = "/opt/homebrew/bin/fish"

[bootstrap.hooks]
final = '''
repo="$(git rev-parse --show-toplevel)"
personal_gitconfig="$repo/dotfiles/personal/gitconfig"
git -C "$repo" config --local user.name "$(git config --file "$personal_gitconfig" --get user.name)"
git -C "$repo" config --local user.email "$(git config --file "$personal_gitconfig" --get user.email)"
bash "$repo/dotfiles/work/bootstrap-repositories.sh"
'''

[dotfiles]
"~/.config/fish/conf.d/10-mise-profile.fish" = "dotfiles/work/mise-profile.fish"
"~/.gitconfig" = "dotfiles/work/gitconfig"
"~/.pi/agent/settings.json" = "dotfiles/work/pi/agent/settings.json"
"~/.pi/agent/mcp.json" = "dotfiles/work/pi/agent/mcp.json"
"~/.pi/agent/models.json" = "dotfiles/work/pi/agent/models.json"
"~/.pi/agent/AGENTS.md" = "dotfiles/work/pi/agent/AGENTS.md"
"~/.agents" = "dotfiles/work/agents"

# macOS PAC is per network service. Do not enable automatically at bootstrap.
[tasks."proxy:pac:enable"]
description = "Enable the work-only PAC after observing the named network service"
interactive = true
usage = 'arg "<service>" help="Network service name (e.g. Wi-Fi)"'
run = 'bash dotfiles/work/pac/configure.sh enable {{ usage.service | quote }}'

[tasks."proxy:pac:disable"]
description = "Disable only the PAC URL managed by this work profile"
interactive = true
usage = 'arg "<service>" help="Network service name (e.g. Wi-Fi)"'
run = 'bash dotfiles/work/pac/configure.sh disable {{ usage.service | quote }}'
