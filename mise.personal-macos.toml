[tools]
"aqua:aws/aws-cli" = "2.40.3"
"pipx:ansible-core" = "2.22.0"
"pipx:ansible-lint" = "26.11.0"

[bootstrap.packages]
"brew-cask:discord" = { version = "latest", os = "macos" }
"brew-cask:anki" = { version = "latest", os = "macos" }
"brew-cask:moonlight" = { version = "latest", os = "macos" }
"brew-cask:slack" = { version = "latest", os = "macos" }
"brew-cask:zoom" = { version = "latest", os = "macos" }
"brew-cask:prusaslicer" = { version = "latest", os = "macos" }
"brew-cask:rar" = { version = "latest", os = "macos" }

# One server owns this profile; all Pi sessions connect through localhost HTTP.
[bootstrap.macos.launchd.agents.playwright-mcp-personal-macos]
program = "~/.local/bin/mise"
args = ["--env", "personal-macos", "run", "browser:serve"]
run_at_load = true
keep_alive = true
throttle_interval = 10
working_directory = "~/.local/share/dotfiles"
environment = { PATH = "/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin", MISE_EXEC_AUTO_INSTALL = "false" }
stdout_path = "~/Library/Logs/playwright-mcp-personal-macos.log"
stderr_path = "~/Library/Logs/playwright-mcp-personal-macos.error.log"

[bootstrap.user]
login_shell = "/opt/homebrew/bin/fish"

[dotfiles]
"~/.config/mise/miserc.toml" = "dotfiles/personal/miserc.toml"
"~/.gitconfig" = "dotfiles/personal/gitconfig"
"~/.pi/agent/settings.json" = "dotfiles/personal/pi/agent/settings.json"
"~/.pi/agent/mcp.json" = "dotfiles/personal/pi/agent/mcp.json"
"~/.pi/agent/models.json" = "dotfiles/personal/pi/agent/models.json"
"~/.agents" = "dotfiles/personal/agents"

[tasks."browser:serve"]
description = "Serve the shared personal Playwright MCP browser on loopback"
env = { PLAYWRIGHT_MCP_CONFIG = "{{env.HOME}}/.config/playwright-mcp/config.json", PLAYWRIGHT_MCP_EXECUTABLE_PATH = "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome", PLAYWRIGHT_MCP_USER_DATA_DIR = "{{env.HOME}}/.local/share/playwright-mcp/profiles/personal-macos", PLAYWRIGHT_MCP_OUTPUT_DIR = "{{env.HOME}}/.local/share/playwright-mcp/artifacts/personal-macos", PLAYWRIGHT_MCP_HEADLESS = "false" }
run = "exec playwright-mcp --browser chrome --host 127.0.0.1 --port 8931 --shared-browser-context --no-webmcp --codegen none --console-level error"

[tasks."browser:setup"]
description = "Open dedicated personal Chrome for human sign-in and extension setup; stop the shared MCP server first"
run = '''
exec "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --user-data-dir="${HOME}/.local/share/playwright-mcp/profiles/personal-macos" chrome://extensions/
'''
