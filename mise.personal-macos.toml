[settings.age]
strict = false

[tools]
"aqua:aws/aws-cli" = "2.36.31"

[bootstrap.packages]
"brew-cask:discord" = "latest"
"brew-cask:anki" = "latest"
"brew-cask:moonlight" = "latest"
"brew-cask:google-chrome" = "latest"
"brew-cask:slack" = "latest"
"brew-cask:zoom" = "latest"
"brew-cask:prusaslicer" = "latest"
"brew-cask:rar" = "latest"
"mas:937984704" = "latest"
"mas:1474276998" = "latest"

[bootstrap.user]
login_shell = "/opt/homebrew/bin/fish"

[dotfiles]
"~/.config/fish/conf.d/10-mise-profile.fish" = "dotfiles/personal/mise-profile.fish"
"~/.gitconfig" = "dotfiles/personal/gitconfig"
"~/.pi/agent/settings.json" = "dotfiles/personal/pi/agent/settings.json"
"~/.pi/agent/mcp.json" = "dotfiles/personal/pi/agent/mcp.json"
"~/.pi/agent/models.json" = "dotfiles/personal/pi/agent/models.json"
"~/.pi/agent/extensions/pi-openai-fast.json" = "dotfiles/personal/pi/agent/extensions/pi-openai-fast.json"
"~/.pi/workflows/model-tiers.json" = "dotfiles/personal/pi/workflows/model-tiers.json"
"~/.agents" = "dotfiles/personal/agents"

[env]
CONTEXT7_API_KEY = { age = "" }
BRAVE_SEARCH_API_KEY = { age = "" }
YNAB_API_KEY = { age = "" }
