[tools]
"aqua:aws/aws-cli" = "2.40.0"
"pipx:ansible-core" = "2.22.0"
"pipx:ansible-lint" = "26.11.0"

[bootstrap.packages]
"brew-cask:discord" = { version = "latest", os = "macos" }
"brew-cask:anki" = { version = "latest", os = "macos" }
"brew-cask:moonlight" = { version = "latest", os = "macos" }
"brew-cask:slack" = { version = "latest", os = "macos" }
"brew-cask:zoom" = { version = "latest", os = "macos" }
"brew-cask:prusaslicer" = { version = "latest", os = "macos" }
"brew-cask:rar" = { version = "latest", os = "macos" }

[bootstrap.user]
login_shell = "/opt/homebrew/bin/fish"

[dotfiles]
"~/.config/mise/miserc.toml" = "dotfiles/personal/miserc.toml"
"~/.gitconfig" = "dotfiles/personal/gitconfig"
"~/.pi/agent/settings.json" = "dotfiles/personal/pi/agent/settings.json"
"~/.pi/agent/mcp.json" = "dotfiles/personal/pi/agent/mcp.json"
"~/.pi/agent/models.json" = "dotfiles/personal/pi/agent/models.json"
"~/.agents" = "dotfiles/personal/agents"

[tasks."browser:setup"]
description = "Open dedicated personal Chrome for human sign-in and extension setup; close it before MCP use"
run = '''
exec "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --user-data-dir="${HOME}/.local/share/playwright-mcp/profiles/personal-macos" chrome://extensions/
'''
