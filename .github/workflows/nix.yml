name: Nix

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - run: ./bin/check-dependency-sync
      - run: nix fmt -- --ci --tree-root . --walk filesystem
      - run: nix run .#statix -- check .
      - run: nix run .#deadnix -- --fail .
      - run: nix flake check --all-systems --no-build
      - run: nix build --no-link .#checks.x86_64-linux.{immutable-plugin-policy,dotfile-targets,audit-legacy-discovery,cleanup-confirmation}
      - run: git diff --check
