name: Nix

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - name: Install root tooling
        env:
          COREPACK_ENABLE_PROJECT_SPEC: "1"
        run: corepack npm ci
      - name: Validate MCP lockfiles
        env:
          COREPACK_ENABLE_PROJECT_SPEC: "1"
        run: |
          for profile in personal work; do
            (
              cd "nix/packages/mcp-servers/$profile"
              corepack npm ci --dry-run --ignore-scripts --no-audit --no-fund >/dev/null
            )
          done
      - name: Validate Pi extensions
        working-directory: pi-extensions
        env:
          COREPACK_ENABLE_PROJECT_SPEC: "1"
        run: |
          corepack npm ci
          corepack npm run ci
      - run: nix fmt -- --ci --tree-root . --walk filesystem
      - run: nix run .#statix -- check .
      - run: nix run .#deadnix -- --fail .
      - run: nix flake check --all-systems --no-build
      - run: nix build --no-link .#checks.x86_64-linux.{personal-arch,personal-debian,immutable-plugin-policy,audit-external-state}
      - run: git diff --check


  darwin:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            builders-use-substitutes = true
      - run: >-
          nix build --no-link
          .#darwinConfigurations.personal-macos.system
          .#darwinConfigurations.work-macos.system
          .#checks.aarch64-darwin.comin-deployment-config
          .#checks.aarch64-darwin.comin-darwin-activation
