name: Nix

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - run: nix fmt -- --ci --tree-root . --walk filesystem
      - run: nix run .#statix -- check .
      - run: nix run .#deadnix -- --fail .
      - run: nix flake check --all-systems --no-build
      - run: git diff --check

  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: [personal-arch, personal-debian]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - run: nix build --no-link ".#homeConfigurations.${{ matrix.host }}.activationPackage"
      - run: nix build --no-link .#packages.x86_64-linux.{pi,readseek,twg,pi-extensions}
      - run: nix build --no-link .#checks.x86_64-linux.{immutable-plugin-policy,dotfile-targets,audit-legacy-discovery,cleanup-confirmation}

  darwin:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        host: [personal-macos, work-macos]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - run: nix eval ".#darwinConfigurations.${{ matrix.host }}.config.system.build.toplevel.drvPath"
      - run: nix build --no-link ".#darwinConfigurations.${{ matrix.host }}.system"
      - run: nix build --no-link .#packages.aarch64-darwin.{pi,readseek,twg,pi-extensions}
      - run: nix build --no-link .#checks.aarch64-darwin.{immutable-plugin-policy,dotfile-targets,audit-legacy-discovery,cleanup-confirmation}
