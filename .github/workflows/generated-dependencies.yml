name: Generated dependencies

on:
  schedule:
    - cron: "17 6 * * 2"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: generated-dependency-updates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: cachix/install-nix-action@b4b293eae0b79aac8a161bb32925a5508c9cca93 # v31
        with:
          github_access_token: ${{ github.token }}

      - name: Update generated Nix dependencies
        run: |
          ./bin/nix-update pi
          ./bin/nix-update readseek
          ./bin/nix-update agents
          ./bin/nix-update twg

      - name: Update vendored agent skills
        env:
          # renovate: datasource=npm depName=skills
          SKILLS_CLI_VERSION: "1.5.22"
          NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-cache
          GH_TOKEN: ${{ github.token }}
        run: |
          for profile in personal work; do
            canonical="$GITHUB_WORKSPACE/nix/dotfiles/profiles/$profile"
            generated_dir="$canonical/.pi/agent/skills"
            if [ -e "$generated_dir" ] || [ -L "$generated_dir" ]; then
              echo >&2 "Refusing to replace existing generated skill directory: $generated_dir"
              exit 1
            fi

            HOME="$canonical" npx --yes "skills@$SKILLS_CLI_VERSION" update --global --yes
            rm -rf "$generated_dir"

            legacy="$GITHUB_WORKSPACE/$profile"
            cp "$canonical/.agents/.skill-lock.json" "$legacy/.agents/.skill-lock.json"
            while IFS= read -r skill; do
              rsync -a --delete \
                "$canonical/.agents/skills/$skill/" \
                "$legacy/.agents/skills/$skill/"
            done < <(jq -r '.skills | keys[]' "$canonical/.agents/.skill-lock.json")
          done

      - name: Validate generated dependencies
        run: |
          nix fmt -- --ci --tree-root . --walk filesystem
          nix flake check --all-systems --no-build
          nix build --no-link .#packages.x86_64-linux.{pi,readseek,twg,pi-extensions}
          git diff --check

      - name: Create dependency pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          # Set this secret to a PAT or GitHub App token so generated PRs trigger CI.
          token: ${{ secrets.DEPENDENCY_UPDATE_TOKEN || github.token }}
          branch: automation/generated-dependency-updates
          delete-branch: true
          commit-message: "chore(root): update generated dependencies"
          committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          title: "chore(root): update generated dependencies"
          body: |
            Updates dependencies that require repository-specific generation:

            - Nix npm wrapper manifests, lock files, and fixed-output hashes
            - the TWG release and platform hashes
            - vendored personal and work agent skills

            Generated by `.github/workflows/generated-dependencies.yml`.
          add-paths: |
            nix/packages/**
            nix/dotfiles/profiles/personal/.agents/**
            nix/dotfiles/profiles/work/.agents/**
            personal/.agents/**
            work/.agents/**
