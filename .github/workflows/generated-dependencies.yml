name: Generated dependencies

on:
  schedule:
    - cron: "17 6 * * 2"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: generated-dependency-updates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4
        with:
          version: 2026.8.6
          install: true
          install_args: node
          cache: true

      - name: Update TWG metadata
        run: mise --env personal-macos run update:twg

      - name: Update vendored agent skills
        env:
          # renovate: datasource=npm depName=skills
          SKILLS_CLI_VERSION: "1.5.22"
          NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-cache
          GH_TOKEN: ${{ github.token }}
        run: mise --env personal-macos run update:skills

      - name: Validate generated dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm --prefix pi-extensions ci --legacy-peer-deps --no-audit --no-fund
          node scripts/bootstrap/pi-extensions.mjs --check
          mise run validate:agents
          mise run validate:config
          mise run validate:dotfiles
          mise run validate:repository

      - name: Create dependency pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          # Set this secret to a PAT or GitHub App token so generated PRs trigger CI.
          token: ${{ secrets.DEPENDENCY_UPDATE_TOKEN || github.token }}
          branch: automation/generated-dependency-updates
          delete-branch: true
          commit-message: "chore(root): update generated dependencies"
          committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          title: "chore(root): update generated dependencies"
          body: |
            Updates dependencies that require repository-specific generation:

            - the TWG release and platform checksums
            - the shared vendored agent skill catalog and personal lock subset

            Generated by `.github/workflows/generated-dependencies.yml`.
          add-paths: |
            mise.work-macos.toml
            mise.work-macos.lock
            dotfiles/profiles/common/.agents/**
            dotfiles/profiles/personal/.agents/.skill-lock.json
