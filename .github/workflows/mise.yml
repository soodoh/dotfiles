name: Mise validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  MISE_LOCKED_VERIFY_PROVENANCE: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install native test dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential fish
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.8.16
          install: false
          cache: true
      - name: Detect mise dependency changes
        id: mise-changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          if git diff --quiet "$BASE_SHA" HEAD -- 'mise*.toml' 'mise*.lock' mise.lock.py; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
          else
            echo "changed=true" >>"$GITHUB_OUTPUT"
          fi
      - name: Verify mise lockfile reproducibility
        if: steps.mise-changes.outputs.changed == 'true'
        run: mise run validate:locks
      - name: Install mise-managed tools
        run: mise install --locked
      - name: Validate configuration and colocated tests
        run: mise run validate

  macos:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install native test dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install fish libgit2
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.8.16
          install: true
          cache: true
      - name: Validate configuration and colocated tests
        run: mise run validate
