name: Mise validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  MISE_LOCKED_VERIFY_PROVENANCE: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install native test dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential fish
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4
        with:
          version: 2026.8.8
          install: true
          install_args: "node bun aqua:neovim/neovim aqua:BurntSushi/ripgrep cargo:tree-sitter-cli"
          cache: true
      - name: Validate configuration and colocated tests
        run: mise run validate

  macos:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install native test dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install fish libgit2
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4
        with:
          version: 2026.8.8
          install: true
          install_args: "node bun aqua:neovim/neovim aqua:BurntSushi/ripgrep cargo:tree-sitter-cli"
          cache: true
      - name: Validate configuration and colocated tests
        run: mise run validate
