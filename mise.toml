min_version = "2026.8.6"

[settings]
experimental = true
lockfile = true
dotfiles.default_mode = "symlink"
task.run_auto_install = false

[task_config]
dir = "{{ env.MISE_CONFIG_DIR | default(value=config_root) }}"

[tool_config]
locked = true

[env]
_.path = [
  "{{ env.HOME }}/.local/bin",
  "/opt/homebrew/bin",
  "/opt/homebrew/sbin",
]

[vars]
profile = "unset"
skills_cli_version = "1.5.22"

[tools]
"npm:npm" = "12.0.2"
"npm:corepack" = "0.35.0"
node = "24.18.1"
python = "3.14.6"
bun = "1.3.13"
go = "1.26.5"
rust = { version = "1.97.1", postinstall = "rustup component add clippy rustfmt rust-src rust-analyzer" }
"aqua:astral-sh/uv" = "0.12.1"
"aqua:cli/cli" = "2.97.0"
"aqua:jqlang/jq" = "1.8.2"
"aqua:FiloSottile/age" = "1.3.1"
"aqua:BurntSushi/ripgrep" = "15.2.0"
"aqua:junegunn/fzf" = "0.74.2"
"aqua:atuinsh/atuin" = "18.18.1"
"aqua:jesseduffield/lazygit" = "0.64.0"
"aqua:starship/starship" = "1.26.0"
"aqua:ajeetdsouza/zoxide" = "0.10.0"
"aqua:joshmedeski/sesh" = "2.28.0"
"aqua:sxyazi/yazi" = "26.5.6"
"aqua:neovim/neovim" = "0.12.4"
"github:docker/docker-language-server" = "0.20.1"
"aqua:LuaLS/lua-language-server" = "3.19.0"
"aqua:artempyanykh/marksman" = "2026-02-08"
"aqua:astral-sh/ruff" = "0.16.2"
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:mvdan/sh" = "3.13.1"
"aqua:JohnnyMorganz/StyLua" = "2.5.2"
"cargo:tree-sitter-cli" = "0.26.9"
"cargo:kdlfmt" = "0.1.7"
"cargo:taplo-cli" = "0.10.0"
"go:golang.org/x/tools/gopls" = "0.23.0"
"pipx:yamllint" = "1.37.1"
"npm:@earendil-works/pi-coding-agent" = "0.84.2"
"npm:@playwright/mcp" = "0.0.76"
"npm:awk-language-server" = "0.10.6"
"npm:bash-language-server" = "5.6.0"
"npm:@biomejs/biome" = "2.5.6"
"npm:eslint_d" = "15.0.3"
"npm:graphql-language-service-cli" = "3.5.0"
"npm:oxlint" = "1.78.0"
"npm:prettier" = "3.8.3"
"npm:@prisma/language-server" = "31.1.0"
"npm:pyright" = "1.1.411"
"npm:typescript-language-server" = "5.3.0"
"npm:vim-language-server" = "2.3.1"
"npm:vscode-langservers-extracted" = "4.10.0"
"npm:yaml-language-server" = "1.24.0"

[tools."http:fzf-tmux"]
version = "0.74.2"
bin = "fzf-tmux"

[tools."http:fzf-tmux".platforms]
macos-arm64 = { url = "https://raw.githubusercontent.com/junegunn/fzf/v0.74.2/bin/fzf-tmux", checksum = "sha256:ea14943d739fc81952d5071a642591df25ed8dac166040a6d6036b3be197cecd" }
macos-x64 = { url = "https://raw.githubusercontent.com/junegunn/fzf/v0.74.2/bin/fzf-tmux", checksum = "sha256:ea14943d739fc81952d5071a642591df25ed8dac166040a6d6036b3be197cecd" }
linux-arm64 = { url = "https://raw.githubusercontent.com/junegunn/fzf/v0.74.2/bin/fzf-tmux", checksum = "sha256:ea14943d739fc81952d5071a642591df25ed8dac166040a6d6036b3be197cecd" }
linux-x64 = { url = "https://raw.githubusercontent.com/junegunn/fzf/v0.74.2/bin/fzf-tmux", checksum = "sha256:ea14943d739fc81952d5071a642591df25ed8dac166040a6d6036b3be197cecd" }

[bootstrap.packages]
"apt:fish" = { version = "latest", os = "linux" }
"apt:git" = { version = "latest", os = "linux" }
"apt:gnupg" = { version = "latest", os = "linux" }
"apt:libgit2-dev" = { version = "latest", os = "linux" }
"apt:tmux" = { version = "latest", os = "linux" }
"apt:wget" = { version = "latest", os = "linux" }
"apt:zlib1g" = { version = "latest", os = "linux" }
"brew:fish" = { version = "latest", os = "macos" }
"brew:gnupg" = { version = "latest", os = "macos" }
"brew:tmux" = { version = "latest", os = "macos" }
"brew:wget" = { version = "latest", os = "macos" }
"brew:trash" = { version = "latest", os = "macos" }
"brew:libgit2" = { version = "latest", os = "macos" }
"brew:lima" = { version = "latest", os = "macos" }
"brew:docker" = { version = "latest", os = "macos" }
"brew:docker-compose" = { version = "latest", os = "macos" }
"brew:colima" = { version = "latest", os = "macos" }
"brew:mas" = { version = "latest", os = "macos" }
"brew-cask:ghostty" = { version = "latest", os = "macos" }
"brew-cask:obsidian" = { version = "latest", os = "macos" }
"brew-cask:lunar" = { version = "latest", os = "macos" }
"brew-cask:nextcloud" = { version = "latest", os = "macos" }
"brew-cask:wispr-flow" = { version = "latest", os = "macos" }
"brew-cask:zen" = { version = "latest", os = "macos" }
"brew-cask:font-fira-code-nerd-font" = { version = "latest", os = "macos" }

[bootstrap.macos.dock]
show_recents = false

[bootstrap.macos.defaults.NSGlobalDomain]
NSWindowShouldDragOnGesture = true
AppleICUForce24HourTime = true
AppleInterfaceStyle = "Dark"
AppleShowAllExtensions = true
_HIHideMenuBar = true

[bootstrap.macos.defaults."com.apple.dock"]
autohide = true
wvous-br-corner = 0

[bootstrap.macos.defaults."com.apple.finder"]
AppleShowAllFiles = true
NewWindowTarget = "PfHm"
FXPreferredViewStyle = "clmv"
FXRemoveOldTrashItems = true
ShowExternalHardDrivesOnDesktop = true
ShowHardDrivesOnDesktop = false
ShowMountedServersOnDesktop = false
ShowRemovableMediaOnDesktop = true

[bootstrap.macos.defaults."com.apple.WindowManager"]
EnableTiledWindowMargins = false
EnableStandardClickToShowDesktop = false
StandardHideWidgets = true

[bootstrap.macos.defaults."com.apple.menuextra.clock"]
ShowDate = 2
ShowDayOfWeek = true
ShowAMPM = false

[bootstrap.macos.defaults."com.apple.AppleMultitouchTrackpad"]
TrackpadRightClick = true
TrackpadCornerSecondaryClick = 0

[bootstrap.macos.defaults."com.apple.driver.AppleBluetoothMultitouch.trackpad"]
TrackpadRightClick = true
TrackpadCornerSecondaryClick = 0

[bootstrap.macos.launchd.agents.aerospace]
program = "/Applications/AeroSpace.app/Contents/MacOS/AeroSpace"
run_at_load = true
environment = { PATH = "{{ env.HOME }}/.local/share/mise/shims:/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin" }
stdout_path = "~/Library/Logs/aerospace.log"
stderr_path = "~/Library/Logs/aerospace.error.log"

[bootstrap.macos.launchd.agents.borders]
program = "/opt/homebrew/bin/borders"
args = ["active_color=0xff7aa2f7", "inactive_color=0xff3b4261", "width=5.0"]
run_at_load = true
environment = { PATH = "{{ env.HOME }}/.local/share/mise/shims:/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin" }
stdout_path = "~/Library/Logs/jankyborders.log"
stderr_path = "~/Library/Logs/jankyborders.error.log"

[bootstrap.macos.launchd.agents.colima-default]
program = "/opt/homebrew/bin/colima"
args = ["start", "--foreground", "--profile", "default"]
run_at_load = true
environment = { PATH = "{{ env.HOME }}/.local/share/mise/shims:/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin" }
stdout_path = "~/Library/Logs/colima-default.log"
stderr_path = "~/Library/Logs/colima-default.error.log"

[bootstrap.hooks]
pre-packages = '''
case "{{ vars.profile }}" in
  personal-macos|work-macos) ;;
  *) printf 'error: choose an explicit profile: mise --env personal-macos bootstrap or mise --env work-macos bootstrap\n' >&2; exit 64 ;;
esac
'''

[dotfiles]
"~/.config/.gitignore_global" = "dotfiles/common/gitignore_global"
"~/.config/atuin" = "dotfiles/common/atuin"
"~/.config/fish/config.fish" = "dotfiles/common/fish/config.fish"
"~/.config/fish/custom" = "dotfiles/common/fish/custom"
"~/.config/fish/plugins/abbreviation-tips" = "dotfiles/common/fish/plugins/abbreviation-tips"
"~/.config/fish/plugins/git" = "dotfiles/common/fish/plugins/git"
"~/.config/ghostty" = "dotfiles/common/ghostty"
"~/.config/lazygit" = "dotfiles/common/lazygit"
"~/.config/nvim" = "dotfiles/common/nvim"
"~/.config/sesh" = "dotfiles/common/sesh"
"~/.config/starship.toml" = "dotfiles/common/starship.toml"
"~/.config/tmux" = "dotfiles/common/tmux"
"~/.config/yazi" = "dotfiles/common/yazi"
"~/.config/aerospace" = "dotfiles/macos/aerospace"
"~/.config/sketchybar" = "dotfiles/macos/sketchybar"
"~/.colima/default/colima.yaml" = "dotfiles/macos/colima/colima.yaml"
"~/.pi/agent/AGENTS.md" = "dotfiles/common/pi/agent/AGENTS.md"
"~/.pi/agent/extensions/subagent/config.json" = "dotfiles/common/pi/agent/extensions/subagent/config.json"
"~/.pi/agent/pi-extensions" = "pi-extensions"
"~/.pi/workflows/.gitignore" = "dotfiles/common/pi/workflows/.gitignore"
"~/.pi/workflows/settings.json" = "dotfiles/common/pi/workflows/settings.json"

[tasks.bootstrap]
description = "Install repository-local dependencies and tapped macOS packages"
run = [{ task = "bootstrap:pi" }, { task = "bootstrap:tapped-packages" }]

[tasks."bootstrap:pi"]
run = "npm ci --prefix pi-extensions --legacy-peer-deps --no-audit --no-fund"

[tasks."bootstrap:tapped-packages"]
run = '''
export HOMEBREW_NO_AUTO_UPDATE=1
export HOMEBREW_NO_ANALYTICS=1
export HOMEBREW_NO_ENV_HINTS=1

brew_bin=$(command -v brew 2>/dev/null || true)
if [ -z "$brew_bin" ]; then
  printf 'Homebrew CLI is required for taps without mise-compatible API metadata; installing it now.\n' >&2
  /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
  for candidate in /opt/homebrew/bin/brew /usr/local/bin/brew; do
    if [ -x "$candidate" ]; then
      brew_bin=$candidate
      break
    fi
  done
fi
if [ -z "$brew_bin" ] || [ ! -x "$brew_bin" ]; then
  printf 'error: Homebrew CLI installation did not provide brew\n' >&2
  exit 69
fi

"$brew_bin" list --cask aerospace >/dev/null 2>&1 || "$brew_bin" install --cask nikitabobko/tap/aerospace
"$brew_bin" list sketchybar >/dev/null 2>&1 || "$brew_bin" install FelixKratz/formulae/sketchybar
"$brew_bin" list borders >/dev/null 2>&1 || "$brew_bin" install FelixKratz/formulae/borders
if [ "{{ vars.profile }}" = work-macos ]; then
  "$brew_bin" list --cask snowflake-cli >/dev/null 2>&1 || "$brew_bin" install --cask snowflakedb/snowflake-cli/snowflake-cli
fi
'''

[tasks.status]
description = "Report missing or differing declarative profile state"
run = "mise bootstrap status --missing"

[tasks.validate]
description = "Run native configuration checks and colocated tests"
run = [
  { task = "validate:config" },
  { task = "validate:dotfiles" },
  { task = "validate:agents" },
  { task = "validate:neovim" },
  { task = "validate:macos" },
  { task = "validate:repository" },
]

[tasks."validate:config"]
run = [
  "mise --env personal-macos config >/dev/null",
  "mise --env personal-macos tasks validate >/dev/null",
  "mise --env personal-macos bootstrap plan >/dev/null",
  "mise --env work-macos config >/dev/null",
  "mise --env work-macos tasks validate >/dev/null",
  "mise --env work-macos bootstrap plan >/dev/null",
]

[tasks."validate:dotfiles"]
run = '''
find dotfiles -type f -name '*.sh' -exec bash -n {} +
fish --no-execute dotfiles/common/fish/config.fish
find dotfiles -type f -name '*.fish' -exec fish --no-execute {} \;
'''

[tasks."validate:agents"]
run = [
  "npm ci --ignore-scripts --no-audit --no-fund",
  "npm --prefix pi-extensions ci --legacy-peer-deps --no-audit --no-fund",
  "npm --prefix pi-extensions run ci",
  "node dotfiles/common/tmux/scripts/pi-session-lib.test.mjs",
  "node dotfiles/work/pi/workflows/saved/review-loop.test.mjs",
  '''
log=$(mktemp)
trap 'rm -f "$log"' EXIT
if node dotfiles/work/pi/agent/settings.security.test.mjs >"$log" 2>&1; then
  printf 'error: expected work HTTP security test to fail\n' >&2
  exit 1
fi
grep -F 'FAIL default provider does not use a cleartext HTTP endpoint' "$log" >/dev/null
''',
]

[tasks."validate:neovim"]
run = "dotfiles/common/nvim/tests/validate.sh"

[tasks."validate:macos"]
run = [
  "python3 dotfiles/work/apps/google-calendar.test.py",
  "python3 dotfiles/macos/colima/colima.test.py",
  "for test in dotfiles/macos/sketchybar/plugins/tests/*_test.sh; do bash \"$test\"; done",
]

[tasks."validate:repository"]
run = "git diff --check"

[tasks.update]
description = "Update all explicitly managed dependency groups"
run = [
  '''test "{{ vars.profile }}" != unset || { printf 'error: choose an explicit profile with --env\n' >&2; exit 64; }''',
  { task = "update:tools" },
  { task = "update:agents" },
  { task = "update:skills" },
  { task = "update:neovim" },
  { task = "update:packages" },
  { task = "update:tapped-packages" },
]

[tasks."update:tools"]
run = "mise upgrade --bump"

[tasks."update:agents"]
run = "npm update --prefix pi-extensions --legacy-peer-deps"

[tasks."update:skills"]
run = "npx --yes skills@{{ vars.skills_cli_version }} update --global --yes"

[tasks."update:neovim"]
run = "nvim --headless '+Lazy! sync' +qa"

[tasks."update:packages"]
run = "mise bootstrap packages upgrade"

[tasks."update:tapped-packages"]
run = '''
brew upgrade --cask nikitabobko/tap/aerospace
brew upgrade FelixKratz/formulae/sketchybar FelixKratz/formulae/borders
if [ "{{ vars.profile }}" = work-macos ]; then
  brew upgrade --cask snowflakedb/snowflake-cli/snowflake-cli
fi
'''
