# Compatibility floor; raise only when configuration requires newer features or fixes.
min_version = "2026.10.10"

[settings]
experimental = true
lockfile = true
locked = true
age.key_file = "~/.config/mise/age.txt"
# Workstation credentials load through global config, never dependency manifests.
age.strict = true
dotfiles.default_mode = "symlink"
task.run_auto_install = false

[task_config]
# Stable through the global folder alias; safe mode deliberately skips vars.
dir = "{{ vars.dotfiles_root | default(value=config_root) }}"

[tool_config]
locked = true

[env]
EDITOR = "nvim"
VISUAL = "nvim"
LG_CONFIG_FILE = "{{ env.HOME }}/.config/lazygit/config.yml"
SSH_AUTH_SOCK = "{{ env.HOME }}/.bitwarden-ssh-agent.sock"
CLIPROXYAPI_BASE_URL = "https://llm.ts.diloreto.com/"
_.path = [
  "{{ env.HOME }}/.local/bin",
  "/opt/homebrew/bin",
  "/opt/homebrew/sbin",
]

[vars]
# Resolve once from the declaring file, not the invocation directory or $HOME.
dotfiles_root = "{{ config_source | canonicalize | dirname }}"
skills_cli_version = "1.5.22"
# Refreshed from upstream main by the repository-updates PR workflow.
herdr_focus_notify_ref = "94e8e1394e1bdbaa3dd55d4d83e0e3f98ecab743"
herdr_sesh_ref = "1d1bcc518347b468e438b05ef806102c97414348"

[tools]
node = "24.22.0" # LTS; keep aligned with .nvmrc
"aqua:Schniz/fnm" = "1.39.0"
"aqua:yarnpkg/berry" = "4.18.0"
python = "3.14.8"
# Read-only third-party tap evaluation needs Ruby >= 3 (macOS ships Ruby 2.6).
ruby = "4.0.7"
gcloud = { version = "583.0.0", depends = ["python"] }
bun = "1.4.3"
go = "1.27.2"
rust = { version = "1.99.1", components = ["clippy", "rustfmt", "rust-src", "rust-analyzer"] }
"aqua:astral-sh/uv" = "0.13.1"
"aqua:cli/cli" = "2.102.0"
"aqua:jqlang/jq" = "1.8.2"
"aqua:FiloSottile/age" = "1.3.2"
"aqua:getsops/sops" = "3.13.3"
"aqua:BurntSushi/ripgrep" = "15.2.0"
"aqua:junegunn/fzf" = "0.74.5"
"aqua:jdx/usage" = "7.0.2"
"aqua:atuinsh/atuin" = "18.24.1"
"aqua:jesseduffield/lazygit" = "0.66.2"
"aqua:starship/starship" = "1.27.0"
"aqua:ajeetdsouza/zoxide" = "0.10.0"
"aqua:herdrdev/herdr" = "0.9.5"
"aqua:sxyazi/yazi" = "26.9.1"
"aqua:neovim/neovim" = "0.12.6"
"aqua:opentofu/opentofu" = "1.13.1"
"github:docker/docker-language-server" = "v0.20.1"
"aqua:LuaLS/lua-language-server" = "3.19.2"
"aqua:artempyanykh/marksman" = "2026-02-08"
"aqua:astral-sh/ruff" = "0.17.1"
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:mvdan/sh" = "3.14.1"
"aqua:JohnnyMorganz/StyLua" = "2.6.0"
"aqua:docker/cli" = "29.9.1"
"aqua:docker/compose" = "5.6.0"
# Upstream does not publish macOS binaries; Cargo works on all shared platforms.
"cargo:eza" = "0.23.5"
"cargo:tree-sitter-cli" = "0.27.1"
"cargo:kdlfmt" = "0.1.7"
"cargo:taplo-cli" = "0.10.0"
"go:golang.org/x/tools/gopls" = "v0.24.0"
"pipx:yamllint" = "1.38.0"
"npm:@earendil-works/pi-coding-agent" = "1.3.0"
"npm:agent-browser" = { version = "0.39.1", allow_builds = ["agent-browser"] }
"npm:awk-language-server" = "0.10.6"
"npm:bash-language-server" = { version = "5.8.1", trust_policy_excludes = ["fastq@1.20.2"] }
"npm:@biomejs/biome" = "2.5.15"
"npm:eslint_d" = "15.0.3"
"npm:graphql-language-service-cli" = { version = "3.5.0", trust_policy_excludes = ["fastq@1.20.2"] }
"npm:oxlint" = "1.88.0"
"npm:prettier" = "3.9.10"
"npm:pyright" = "1.1.414"
"npm:typescript-language-server" = "6.0.2"
"npm:vim-language-server" = "2.3.1"
"npm:vscode-langservers-extracted" = "4.10.0"
"npm:yaml-language-server" = "1.25.0"


[bootstrap.packages]
"apt:fish" = { version = "latest", os = "linux" }
"apt:git" = { version = "latest", os = "linux" }
"apt:gnupg" = { version = "latest", os = "linux" }
"brew:fish" = { version = "latest", os = "macos" }
"brew:gnupg" = { version = "latest", os = "macos" }
"brew:lima" = { version = "latest", os = "macos" }
"brew:colima" = { version = "latest", os = "macos" }
"brew:tailscale" = { version = "latest", os = "macos" }
"brew:mas" = { version = "latest", os = "macos" }
"mas:937984704" = { version = "latest", os = "macos" }
"mas:1474276998" = { version = "latest", os = "macos" }
"brew:firefoxpwa" = { version = "latest", os = "macos" }
# Ordinary third-party taps are resolved natively by the minimum mise version.
"brew:FelixKratz/formulae/sketchybar" = { version = "latest", os = "macos" }
"brew:FelixKratz/formulae/borders" = { version = "latest", os = "macos" }
"brew:rjyo/moshi/moshi-hook" = { version = "latest", os = "macos" }
"brew:vjeantet/tap/alerter" = { version = "latest", os = "macos" }
"brew-cask:nikitabobko/tap/aerospace" = { version = "latest", os = "macos" }
"brew-cask:bitwarden" = { version = "latest", os = "macos" }
"brew-cask:ghostty" = { version = "latest", os = "macos" }
"brew-cask:obsidian" = { version = "latest", os = "macos" }
"brew-cask:mindwtr" = { version = "latest", os = "macos" }
"brew-cask:openwhispr" = { version = "latest", os = "macos" }
"brew-cask:lunar" = { version = "latest", os = "macos" }
"brew-cask:nextcloud" = { version = "latest", os = "macos" }
"brew-cask:zen" = { version = "latest", os = "macos" }
"brew-cask:font-fira-code-nerd-font" = { version = "latest", os = "macos" }

[bootstrap.macos.dock]
show_recents = false

[bootstrap.macos.defaults.NSGlobalDomain]
NSWindowShouldDragOnGesture = true
AppleICUForce24HourTime = true
AppleInterfaceStyle = "Dark"
AppleShowAllExtensions = true
SLSMenuBarUseBlurredAppearance = true
_HIHideMenuBar = true

[bootstrap.macos.defaults."com.apple.dock"]
autohide = true
wvous-br-corner = 0

[bootstrap.macos.defaults."com.apple.finder"]
AppleShowAllFiles = true
NewWindowTarget = "PfLo"
FXPreferredViewStyle = "clmv"
FXRemoveOldTrashItems = true
ShowExternalHardDrivesOnDesktop = true
ShowHardDrivesOnDesktop = false
ShowMountedServersOnDesktop = false
ShowRemovableMediaOnDesktop = true

[bootstrap.macos.defaults."com.apple.WindowManager"]
EnableTiledWindowMargins = false
EnableStandardClickToShowDesktop = false
StandardHideWidgets = true

[bootstrap.macos.defaults."com.apple.controlcenter"]
"NSStatusItem VisibleCC Clock" = true
"NSStatusItem VisibleCC BentoBox-0" = true
"NSStatusItem VisibleCC Battery" = true
"NSStatusItem VisibleCC WiFi" = true
"NSStatusItem VisibleCC Bluetooth" = true
# Positions increase moving left from the clock.
"NSStatusItem Preferred Position BentoBox-0" = 90.0
"NSStatusItem Preferred Position Battery" = 132.0
"NSStatusItem Preferred Position WiFi" = 174.0
"NSStatusItem Preferred Position Bluetooth" = 212.0

[bootstrap.macos.defaults."com.apple.menuextra.clock"]
ShowDate = 2
ShowDayOfWeek = true
ShowAMPM = false

[bootstrap.macos.defaults."com.apple.AppleMultitouchTrackpad"]
TrackpadRightClick = true
TrackpadCornerSecondaryClick = 0

[bootstrap.macos.defaults."com.apple.driver.AppleBluetoothMultitouch.trackpad"]
TrackpadRightClick = true
TrackpadCornerSecondaryClick = 0

[bootstrap.macos.launchd.agents.aerospace]
program = "/Applications/AeroSpace.app/Contents/MacOS/AeroSpace"
run_at_load = true
environment = { PATH = "/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin" }
stdout_path = "~/Library/Logs/aerospace.log"
stderr_path = "~/Library/Logs/aerospace.error.log"

[bootstrap.macos.launchd.agents.borders]
program = "/opt/homebrew/bin/borders"
args = ["active_color=0xff7aa2f7", "inactive_color=0xff3b4261", "width=5.0"]
run_at_load = true
environment = { PATH = "/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin" }
stdout_path = "~/Library/Logs/jankyborders.log"
stderr_path = "~/Library/Logs/jankyborders.error.log"

[bootstrap.macos.launchd.agents.colima-default]
program = "~/.local/bin/mise"
# A failed start can leave Lima alive; clean it up before launchd retries.
args = ["exec", "--", "/bin/sh", "-c", '''
/opt/homebrew/bin/colima start --foreground --profile default --save-config=false
status=$?
if [ "$status" -ne 0 ]; then
  /opt/homebrew/bin/colima stop --force --profile default
fi
exit "$status"
''']
run_at_load = true
keep_alive_on_failure = true
throttle_interval = 60
working_directory = "~/.local/share/dotfiles"
stdout_path = "~/Library/Logs/colima-default.log"
stderr_path = "~/Library/Logs/colima-default.error.log"

# mise installs the Homebrew formula and owns the user service and its tool PATH.
# Use the shared tool configuration, as with Colima; no profile-specific tools needed.
[bootstrap.macos.launchd.agents.moshi-hook]
program = "~/.local/bin/mise"
args = ["exec", "--", "/opt/homebrew/opt/moshi-hook/bin/moshi-hook", "serve"]
run_at_load = true
keep_alive = true
working_directory = "~/.local/share/dotfiles"
stdout_path = "~/Library/Logs/moshi-hook.log"
stderr_path = "~/Library/Logs/moshi-hook.error.log"

[bootstrap.hooks]
pre-tools = '''
mise install python
CLOUDSDK_PYTHON="$(mise which python3)" mise install gcloud
'''
pre-packages = '''
# Bootstrap hooks do not export the profile selected by miserc.toml or --env.
export MISE_ENV={{ mise_env | default(value=[]) | join(sep=",") | quote }}
case "$MISE_ENV" in
  personal-macos|work-macos) ;;
  *) printf 'error: choose an explicit profile: mise --env personal-macos bootstrap or mise --env work-macos bootstrap\n' >&2; exit 64 ;;
esac

if [ "$(uname -s)" = Darwin ]; then
  # The mas package manager must exist before the main package pass discovers it.
  mise bootstrap packages apply brew:mas --yes
fi
'''
post-defaults = '''
defaults write com.apple.finder NewWindowTargetPath -string "file://${HOME}/Projects/"
'''

[dotfiles]
# Stable runtime anchor for services that need this checkout's mise configuration.
"~/.local/share/dotfiles" = "."
"~/.config/.gitignore_global" = "dotfiles/common/gitignore_global"
# Expose the checkout through native global folder-fragment discovery.
"~/.config/mise/config.toml" = "dotfiles/common/mise/config.toml"
# Credentials are global-only; a checkout alone remains usable by Renovate.
# Link both overlays so --env can override the installed workstation profile.
"~/.config/mise/conf.d/credentials.toml" = "dotfiles/common/mise/credentials.toml"
"~/.config/mise/config.personal-macos.toml" = "dotfiles/personal/mise-credentials.toml"
"~/.config/mise/config.work-macos.toml" = "dotfiles/work/mise-credentials.toml"
"~/.config/mise/conf.d/dotfiles" = "."
# Folder fragments share the enclosing global directory's lockfiles.
"~/.config/mise/mise.lock" = "mise.lock"
"~/.config/mise/mise.personal-macos.lock" = "mise.personal-macos.lock"
"~/.config/mise/mise.work-macos.lock" = "mise.work-macos.lock"
"~/.config/atuin" = "dotfiles/common/atuin"
"~/.config/fish/config.fish" = "dotfiles/common/fish/config.fish"
"~/.config/fish/custom" = "dotfiles/common/fish/custom"
"~/.config/fish/plugins/abbreviation-tips" = "dotfiles/common/fish/plugins/abbreviation-tips"
"~/.config/ghostty" = "dotfiles/common/ghostty"
"~/.config/lazygit" = "dotfiles/common/lazygit"
"~/.config/nvim" = "dotfiles/common/nvim"
"~/.config/herdr/config.toml" = "dotfiles/common/herdr/config.toml"
"~/.config/starship.toml" = "dotfiles/common/starship.toml"
"~/.config/yazi" = "dotfiles/common/yazi"
"~/.config/aerospace" = "dotfiles/macos/aerospace"
"~/.config/sketchybar" = "dotfiles/macos/sketchybar"
"~/.colima/default/colima.yaml" = "dotfiles/macos/colima/colima.yaml"
"~/.pi/agent/keybindings.json" = "dotfiles/common/pi/agent/keybindings.json"
"~/.pi/agent/web-search.json" = "dotfiles/common/pi/agent/web-search.json"
"~/.pi/agent/extensions/subagent/config.json" = "dotfiles/common/pi/agent/extensions/subagent/config.json"
"~/.pi/agent/pi-extensions" = "pi-extensions"

[tasks.bootstrap]
description = "Install repository dependencies and configure managed integrations"
run = [
  { task = "bootstrap:pi" },
  { task = "bootstrap:herdr-plugins" },
  { task = "configure:agent-browser" },
  { task = "configure:google-calendar-webapp" },
  { task = "configure:docker-compose-plugin" },
]

[tasks."bootstrap:pi"]
run = "bun ci --cwd pi-extensions"

[tasks."bootstrap:herdr-plugins"]
description = "Reconcile Herdr plugins to committed pins; preserve unsafe or disabled state"
run = "python3 dotfiles/common/herdr/plugin.py bootstrap"

[tasks."update:herdr-plugins"]
description = "Reconcile committed Herdr plugin pins (same behavior as bootstrap)"
run = "python3 dotfiles/common/herdr/plugin.py update"

[tasks."update:herdr-plugin-pin"]
description = "Refresh desired Herdr plugin SHAs from upstream main without installing them"
run = "python3 dotfiles/common/herdr/plugin.py refresh-pin"

[tasks."configure:docker-compose-plugin"]
description = "Expose the mise-managed Compose binary as a Docker CLI plugin"
run = '''
plugin_dir="${DOCKER_CONFIG:-$HOME/.docker}/cli-plugins"
mkdir -p "$plugin_dir"
ln -sfn "$(mise which docker-cli-plugin-docker-compose)" "$plugin_dir/docker-compose"
'''

[tasks."configure:agent-browser"]
description = "Install Chrome for the mise-managed agent-browser CLI"
run = "agent-browser install"

[tasks."configure:google-calendar-webapp"]
description = "Install the FirefoxPWA runtime and Google Calendar web app on macOS"
run = "bash dotfiles/macos/firefoxpwa/google-calendar.sh"

[tasks.status]
description = "Report missing or differing declarative profile state"
run = "mise bootstrap status --missing"

[tasks.lock]
description = "Refresh shared and profile-specific mise lockfiles"
run = "python3 mise.lock.py refresh"

[tasks.validate]
description = "Run fast checks before external-runtime integration tests"
run = [{ task = "validate:fast" }, { task = "validate:integration" }]

[tasks."validate:fast"]
description = "Run syntax, policy, unit, and repository checks"
depends = [
  "validate:config",
  "validate:dotfiles:fast",
  "validate:agents:fast",
  "validate:macos:fast",
  "validate:repository",
]

[tasks."validate:integration"]
description = "Run tests that launch external application runtimes"
depends = [
  "validate:dotfiles:integration",
  "validate:agents:integration",
  "validate:neovim",
  "validate:macos:integration",
]

[tasks."validate:config"]
run = [
  "python3 mise.bootstrap.test.py",
  "python3 mise.lock.test.py",
  "python3 .github/workflows/mise-cache-key.test.py",
  "python3 dotfiles/common/herdr/plugin.test.py",
  # Remove this narrow exception once actionlint supports GitHub-hosted Ubuntu 26 upstream.
  "actionlint -ignore '^label \"ubuntu-26[.]04\" is unknown[.]'",
  '''if [ "$(uname -s)" = Darwin ]; then
    mise --env personal-macos bootstrap plan >/dev/null
    mise --env work-macos bootstrap plan >/dev/null
  fi''',
]

[tasks."validate:locks"]
description = "Regenerate mise lockfiles and verify the canonical Linux output"
run = "python3 mise.lock.py check"

[tasks."validate:dotfiles:fast"]
run = '''
find dotfiles -type f -name '*.sh' -exec bash -n {} +
find dotfiles -type f -name '*.fish' -exec fish --no-execute {} \;
bash dotfiles/work/bootstrap-repositories.test.sh
bash dotfiles/work/gost-tailscale-control.test.sh
node dotfiles/work/pac/cli-proxy.test.mjs
python3 dotfiles/common/fish/config.test.py
HERDR_CONFIG_PATH="$PWD/dotfiles/common/herdr/config.toml" herdr config check
'''

[tasks."validate:dotfiles:integration"]
run = "python3 dotfiles/common/yazi/copy-relative-path.test.py"

[tasks."validate:agents:install"]
description = "Install locked extension dependencies before either validation lane"
run = "bun ci --cwd pi-extensions"

[tasks."validate:agents:fast"]
depends = ["validate:agents:install"]
run = "bun run --cwd pi-extensions ci:fast"

[tasks."validate:agents:integration"]
depends = ["validate:agents:install"]
run = [
  'node pi-extensions/extensions-host.test.mjs "$(mise which pi)"',
  'node pi-extensions/native-mcp-host.test.mjs "$(mise which pi)"',
  'bun run --cwd pi-extensions test:host -- "$(mise which pi)"',
  'python3 pi-extensions/packages/agent-state/integration.test.py "$(mise which pi)"',
  'node pi-extensions/packages/aidev-track/integration-host.test.mjs "$(mise which pi)"',
  'node pi-extensions/packages/shared-prompt-history/integration-host.test.mjs "$(mise which pi)"',
  'node pi-extensions/packages/auto-session-name/integration-host.test.mjs "$(mise which pi)"',
  'node pi-extensions/packages/statusline/integration-host.test.mjs "$(mise which pi)"',
]

[tasks."validate:neovim"]
run = "dotfiles/common/nvim/tests/validate.sh"

[tasks."validate:macos:fast"]
run = '''
for test in dotfiles/macos/sketchybar/plugins/tests/*_test.sh; do bash "$test"; done
if [ "$(uname -s)" = Darwin ]; then
  bash dotfiles/macos/sketchybar/helper/build.sh test
fi
'''

[tasks."validate:macos:integration"]
run = "bash dotfiles/macos/firefoxpwa/google-calendar.test.sh"

[tasks."validate:repository"]
run = "git diff --check"

[tasks.update]
description = "Update all explicitly managed dependency groups"
run = [
  '''case "${MISE_ENV:-}" in
  personal-macos|work-macos) ;;
  *) printf 'error: choose an active profile with --env\n' >&2; exit 64 ;;
esac''',
  { task = "update:tools" },
  { task = "configure:docker-compose-plugin" },
  { task = "update:agents" },
  { task = "update:skills" },
  { task = "update:neovim" },
  { task = "update:packages" },
  { task = "update:herdr-plugins" },
]

[tasks."update:tools"]
run = "python3 mise.lock.py update"

[tasks."update:agents"]
run = "bun update --cwd pi-extensions"

[tasks."update:skills"]
run = "npx --yes skills@{{ vars.skills_cli_version }} update --global --yes"

[tasks."update:neovim"]
run = "nvim --headless '+Lazy! sync' +qa"

[tasks."update:packages"]
run = "mise bootstrap packages upgrade"
