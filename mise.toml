min_version = "2026.8.6"

[settings]
experimental = true
lockfile = true
dotfiles.default_mode = "symlink"
task.run_auto_install = false

[tool_config]
locked = true

[env]
_.path = ["{{ env.HOME }}/.local/bin"]

[vars]
profile = "unset"

[tools]
node = "24.18.1"
python = "3.14.6"
bun = "1.3.13"
go = "1.26.5"
rust = { version = "1.97.1", postinstall = "rustup component add clippy rustfmt rust-src rust-analyzer" }
"aqua:astral-sh/uv" = "0.12.1"
"aqua:cli/cli" = "2.97.0"
"aqua:jqlang/jq" = "1.8.2"
"aqua:BurntSushi/ripgrep" = "15.2.0"
"aqua:junegunn/fzf" = "0.74.2"
"aqua:atuinsh/atuin" = "18.18.1"
"aqua:jesseduffield/lazygit" = "0.64.0"
"aqua:starship/starship" = "1.26.0"
"aqua:ajeetdsouza/zoxide" = "0.10.0"
"aqua:joshmedeski/sesh" = "2.28.0"
"aqua:sxyazi/yazi" = "26.5.6"
"aqua:neovim/neovim" = "0.12.4"
"github:docker/docker-language-server" = "0.20.1"
"aqua:LuaLS/lua-language-server" = "3.19.0"
"aqua:artempyanykh/marksman" = "2026-02-08"
"aqua:astral-sh/ruff" = "0.16.2"
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:mvdan/sh" = "3.13.1"
"aqua:JohnnyMorganz/StyLua" = "2.5.2"
"cargo:tree-sitter-cli" = "0.26.9"
"cargo:kdlfmt" = "0.1.7"
"cargo:taplo-cli" = "0.10.0"
"go:golang.org/x/tools/gopls" = "0.23.0"
"pipx:yamllint" = "1.37.1"
"npm:@earendil-works/pi-coding-agent" = "0.84.2"
"npm:corepack" = "0.35.0"
"npm:npm" = "12.0.2"
"npm:@playwright/mcp" = "0.0.76"
"npm:awk-language-server" = "0.10.6"
"npm:bash-language-server" = "5.6.0"
"npm:@biomejs/biome" = "2.5.6"
"npm:eslint_d" = "15.0.3"
"npm:graphql-language-service-cli" = "3.5.0"
"npm:oxlint" = "1.78.0"
"npm:prettier" = "3.8.3"
"npm:@prisma/language-server" = "31.1.0"
"npm:pyright" = "1.1.411"
"npm:typescript-language-server" = "5.3.0"
"npm:vim-language-server" = "2.3.1"
"npm:vscode-langservers-extracted" = "4.10.0"
"npm:yaml-language-server" = "1.24.0"

[bootstrap.brew.taps]
"FelixKratz/formulae" = "https://github.com/FelixKratz/homebrew-formulae.git"

[bootstrap.packages]
"apt:fish" = { version = "latest", os = "linux" }
"apt:git" = { version = "latest", os = "linux" }
"apt:gnupg" = { version = "latest", os = "linux" }
"apt:libgit2-dev" = { version = "latest", os = "linux" }
"apt:tmux" = { version = "latest", os = "linux" }
"apt:wget" = { version = "latest", os = "linux" }
"apt:zlib1g" = { version = "latest", os = "linux" }
"brew:fish" = { version = "latest", os = "macos" }
"brew:gnupg" = { version = "latest", os = "macos" }
"brew:tmux" = { version = "latest", os = "macos" }
"brew:wget" = { version = "latest", os = "macos" }
"brew:trash" = { version = "latest", os = "macos" }
"brew:libgit2" = { version = "latest", os = "macos" }
"brew:lima" = { version = "latest", os = "macos" }
"brew:docker" = { version = "latest", os = "macos" }
"brew:docker-compose" = { version = "latest", os = "macos" }
"brew:colima" = { version = "latest", os = "macos" }
"brew:dockutil" = { version = "latest", os = "macos" }
"brew:mas" = { version = "latest", os = "macos" }
"brew:FelixKratz/formulae/sketchybar" = { version = "latest", os = "macos" }
"brew:FelixKratz/formulae/borders" = { version = "latest", os = "macos" }
"brew-cask:ghostty" = { version = "latest", os = "macos" }
"brew-cask:obsidian" = { version = "latest", os = "macos" }
"brew-cask:lunar" = { version = "latest", os = "macos" }
"brew-cask:nextcloud" = { version = "latest", os = "macos" }
"brew-cask:wispr-flow" = { version = "latest", os = "macos" }
"brew-cask:zen" = { version = "latest", os = "macos" }
"brew-cask:font-fira-code-nerd-font" = { version = "latest", os = "macos" }

[bootstrap.macos.dock]
show_recents = false

[bootstrap.macos.defaults]
NSGlobalDomain = { NSWindowShouldDragOnGesture = true }

[bootstrap.hooks]
pre-packages = "./scripts/bootstrap/require-profile.sh"
pre-dotfiles = "./scripts/bootstrap/require-profile.sh"
post-tools = "./scripts/bootstrap/rust-components.sh"

[dotfiles]
"~/.config/.gitignore_global" = "dotfiles/common/.config/.gitignore_global"
"~/.config/atuin" = "dotfiles/common/.config/atuin"
"~/.config/fish/config.fish" = "dotfiles/common/.config/fish/config.fish"
"~/.config/fish/custom" = "dotfiles/common/.config/fish/custom"
"~/.config/fish/plugins/abbreviation-tips" = "dotfiles/common/.config/fish/plugins/abbreviation-tips"
"~/.config/fish/plugins/git" = "dotfiles/common/.config/fish/plugins/git"
"~/.config/ghostty" = "dotfiles/common/.config/ghostty"
"~/.config/lazygit" = "dotfiles/common/.config/lazygit"
"~/.config/nvim" = "dotfiles/common/.config/nvim"
"~/.config/sesh" = "dotfiles/common/.config/sesh"
"~/.config/starship.toml" = "dotfiles/common/.config/starship.toml"
"~/.config/tmux" = "dotfiles/common/.config/tmux"
"~/.config/yazi" = "dotfiles/common/.config/yazi"
"~/.config/aerospace" = "dotfiles/darwin/.config/aerospace"
"~/.config/sketchybar" = "dotfiles/darwin/.config/sketchybar"
"~/.colima/default/colima.yaml" = "dotfiles/darwin/.colima/default/colima.yaml"
"~/.pi/agent/AGENTS.md" = "dotfiles/profiles/common/.pi/agent/AGENTS.md"
"~/.pi/agent/extensions/subagent/config.json" = "dotfiles/profiles/common/.pi/agent/extensions/subagent/config.json"
"~/.pi/agent/pi-extensions" = "pi-extensions"
"~/.pi/workflows/.gitignore" = "dotfiles/profiles/common/.pi/workflows/.gitignore"
"~/.pi/workflows/settings.json" = "dotfiles/profiles/common/.pi/workflows/settings.json"

[tasks.bootstrap]
description = "Reconcile the selected explicit macOS profile without upgrading existing apps"
run = "./scripts/bootstrap/bootstrap.sh {{ vars.profile }}"

[tasks.status]
description = "Report missing or differing profile state without changing it"
run = "./scripts/validate/status.sh {{ vars.profile }}"

[tasks.validate]
description = "Run the complete non-destructive repository validation suite"
run = [
  "mise run validate:config",
  "mise run validate:tools",
  "mise run validate:dotfiles",
  "mise run validate:agents",
  "mise run validate:neovim",
  "mise run validate:macos",
  "mise run validate:repository",
]

[tasks."validate:config"]
run = "./scripts/validate/config.sh"

[tasks."validate:tools"]
run = "./scripts/validate/tools.py"

[tasks."validate:dotfiles"]
run = ["./scripts/validate/dotfiles.py", "./scripts/validate/shell.sh"]

[tasks."validate:neovim"]
run = "./scripts/validate/neovim.sh"

[tasks."validate:agents"]
run = "./scripts/validate/agents.sh"

[tasks."validate:macos"]
run = "./scripts/validate/macos.sh"

[tasks."validate:repository"]
run = [
  "./scripts/validate/twg.py",
  "./scripts/validate/no-active-nix.sh",
  "git diff --check",
]

[tasks.update]
description = "Update all explicitly managed dependency groups"
run = [
  "./scripts/bootstrap/require-profile.sh --explicit {{ vars.profile }}",
  "mise --env {{ vars.profile }} run update:tools",
  "mise --env {{ vars.profile }} run update:agents",
  "mise --env {{ vars.profile }} run update:skills",
  "mise --env {{ vars.profile }} run update:neovim",
  "mise --env {{ vars.profile }} run update:apps",
  "mise --env {{ vars.profile }} run update:mas",
  "mise --env {{ vars.profile }} run update:twg",
]

[tasks."update:tools"]
run = ["./scripts/bootstrap/require-profile.sh --explicit {{ vars.profile }}", "mise --env {{ vars.profile }} upgrade --bump"]

[tasks."update:agents"]
run = [
  "./scripts/bootstrap/require-profile.sh --explicit {{ vars.profile }}",
  "npm update --prefix pi-extensions --legacy-peer-deps",
  "node scripts/bootstrap/pi-extensions.mjs",
  "npm update --prefix packages/work-mcp-servers",
]

[tasks."update:skills"]
run = ["./scripts/bootstrap/require-profile.sh --explicit {{ vars.profile }}", "./scripts/update/skills.sh"]

[tasks."update:neovim"]
run = ["./scripts/bootstrap/require-profile.sh --explicit {{ vars.profile }}", "nvim --headless '+Lazy! sync' +qa"]

[tasks."update:apps"]
run = "./scripts/update/apps.sh {{ vars.profile }}"

[tasks."update:mas"]
run = [
  "./scripts/bootstrap/require-profile.sh --explicit {{ vars.profile }}",
  "./scripts/bootstrap/require-macos.sh",
  "mise --env {{ vars.profile }} bootstrap packages upgrade --manager mas",
]

[tasks."update:twg"]
run = ["./scripts/bootstrap/require-profile.sh --explicit {{ vars.profile }}", "./scripts/update/twg.sh"]
