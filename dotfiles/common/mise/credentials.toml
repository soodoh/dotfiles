# Workstation-only environment, linked into global conf.d by mise dot apply.
[env]
CLIPROXYAPI_API_KEY = { age = "" }
CLIPROXYAPI_MANAGEMENT_KEY = { age = "" }
CONTEXT7_API_KEY = { age = "" }
BRAVE_API_KEY = { age = "" }
# Persist Google Cloud configuration without storing it in plain text.
GOOGLE_CLOUD_PROJECT = { age = "" }
