onboarding = false

[theme]
name = "terminal"

[terminal]
new_cwd = "follow"

[ui]
prompt_new_tab_name = false
pane_borders = true
pane_outer_borders = false
pane_gaps = false
show_agent_labels_on_pane_borders = true
hide_tab_bar_when_single_tab = false
status_indicators = "symbols"
confirm_close = true

[keys]
# General
prefix = "ctrl+space"
toggle_sidebar = "prefix+space"
goto = ["alt+e"]
zoom = "prefix+z"
detach = ["prefix+d", "prefix+q"]
settings = "prefix+s"
reload_config = "prefix+shift+r"
help = "prefix+?"
open_notification_target = "prefix+o"
remote_image_paste = "ctrl+v"

# Modes
copy_mode = ["prefix+enter", "prefix+["]
resize_mode = "prefix+r"
workspace_picker = ["alt+w", "prefix+w"]
edit_scrollback = "prefix+shift+e"

# Tabs
previous_tab = ["alt+h"]
next_tab = ["alt+l"]
new_tab = ["alt+t"]
move_tab_previous = ["alt+i"]
move_tab_next = ["alt+o"]
rename_tab = "prefix+shift+t"
switch_tab = "prefix+1..9"
close_tab = "prefix+shift+x"
# Panes
last_pane = ["alt+tab", "prefix+tab"]
cycle_pane_next = ["alt+j"]
cycle_pane_previous = ["alt+k"]
split_vertical = ["alt+v"]
split_horizontal = ["alt+s"]
close_pane = ["alt+x"]
focus_pane_left = ""
focus_pane_down = ""
focus_pane_up = ""
focus_pane_right = ""
swap_pane_left = "prefix+shift+h"
swap_pane_down = "prefix+shift+j"
swap_pane_up = "prefix+shift+k"
swap_pane_right = "prefix+shift+l"
rename_pane = "prefix+shift+p"
# Workspaces
previous_workspace = ["alt+shift+h"]
next_workspace = ["alt+shift+l"]
rename_workspace = "prefix+shift+w"
close_workspace = "prefix+shift+d"
switch_workspace = ""
# Agents
previous_agent = ["alt+shift+j"]
next_agent = ["alt+shift+k"]
new_workspace = ["alt+n", "prefix+n"]
focus_agent = ""

# Worktrees
new_worktree = "prefix+shift+g"
open_worktree = "prefix+t"
remove_worktree = ""

# Navigate-mode (alt+w)
navigate_workspace_up = "up"
navigate_workspace_down = "down"
navigate_pane_left = "h"
navigate_pane_down = "j"
navigate_pane_up = "k"
navigate_pane_right = "l"

# Tool popups
[[keys.command]]
key = "prefix+e"
type = "popup"
command = "yazi"
description = "Open Yazi"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+g"
type = "popup"
command = "lazygit"
description = "Open LazyGit"
width = "90%"
height = "90%"
