id = "dotfiles.process-icons"
name = "Process icons"
version = "0.1.0"
min_herdr_version = "0.9.5"
description = "Label tabs with Nerd Font icons for the processes running in their panes"
platforms = ["linux", "macos"]

# Herdr does not offer pane.updated or layout.updated to plugin hooks, so one
# elected watcher subscribes over the socket. Startup and lifecycle hooks only
# (re)start it; a hook that loses the election exits immediately.
[[startup]]
command = ["python3", "icons.py", "watch"]

[[events]]
on = "tab.focused"
command = ["python3", "icons.py", "watch"]

[[events]]
on = "tab.created"
command = ["python3", "icons.py", "watch"]

[[events]]
on = "pane.created"
command = ["python3", "icons.py", "watch"]
