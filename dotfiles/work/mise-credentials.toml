# Loaded as global config.work-macos.toml only for the selected profile.
[env]
NODE_OPTIONS = "--use-system-ca"
AZURE_CONFIG_DIR = "{{ env.HOME }}/.azure/dev/.azure"
SSL_CERT_FILE = { age = "" }
REQUESTS_CA_BUNDLE = "${SSL_CERT_FILE:-}"
NODE_EXTRA_CA_CERTS = "${SSL_CERT_FILE:-}"
AWS_CA_BUNDLE = "${SSL_CERT_FILE:-}"
CURL_CA_BUNDLE = "${SSL_CERT_FILE:-}"
HTTPLIB2_CA_CERTS = "${SSL_CERT_FILE:-}"
HTTP_PROXY = "http://127.0.0.1:1055"
HTTPS_PROXY = "http://127.0.0.1:1055"
NO_PROXY = "localhost,127.0.0.1,::1"
GH_HOST = { age = "" }
GH_ENTERPRISE_TOKEN = { age = "" }
FIGMA_API_KEY = { age = "" }
LITELLM_API_KEY = { age = "" }
ADO_MCP_PAT_BASIC = { age = "" }
AZURE_SUBSCRIPTION_ID = { age = "" }
AZURE_DEV_TENANT_ID = { age = "" }
AZURE_PROD_TENANT_ID = { age = "" }
GOST_AUTH_USERNAME = { age = "" }
GOST_AUTH_PASSWORD = { age = "" }
# Approved Google-hosted Workspace MCPs share this OAuth client secret.
GWS_MCP_CLIENT_SECRET = { age = "" }
